<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mickey Watch Config Applier</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
        }

        .section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            position: sticky;
            top: 20px;
            height: fit-content;
        }

        .preview-title {
            font-size: 24px;
            font-weight: bold;
        }

        .canvas-container {
            width: 600px;
            height: 600px;
            background: #000;
            border: 2px solid #444;
            position: relative;
            overflow: hidden;
        }

        .canvas-item {
            position: absolute;
            top: 0;
            left: 0;
        }

        .canvas-item img {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .axis-marker {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #ff0000;
            border: 2px solid #fff;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 100;
        }

        .config-input-section {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #0066ff;
        }

        .config-input-section h3 {
            margin-bottom: 15px;
            font-size: 16px;
            color: #0066ff;
        }

        .config-input-section textarea {
            width: 100%;
            height: 300px;
            padding: 12px;
            background: #1a1a1a;
            border: 1px solid #444;
            color: #fff;
            border-radius: 4px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
            resize: vertical;
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        button {
            flex: 1;
            padding: 12px;
            background: #0066ff;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background: #0052cc;
        }

        button.secondary {
            background: #444;
        }

        button.secondary:hover {
            background: #555;
        }

        .status-message {
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-size: 13px;
            min-height: 20px;
        }

        .status-message.success {
            background: #0d5c1a;
            color: #4ade80;
            border: 1px solid #22c55e;
        }

        .status-message.error {
            background: #5c0d0d;
            color: #f87171;
            border: 1px solid #ef4444;
        }

        .instruction {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 4px;
            border-left: 4px solid #ff9900;
            font-size: 13px;
            line-height: 1.6;
            color: #ddd;
        }

        @media (max-width: 1200px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="preview">
            <div class="preview-title">Mickey Watch Preview</div>
            <div class="canvas-container" id="canvas">
                <!-- Body -->
                <div class="canvas-item" id="bodyContainer">
                    <img src="/images/mickey-watch/body.png" alt="Body">
                </div>
                
                <!-- Watch Face -->
                <div class="canvas-item" id="watchFaceContainer">
                    <img src="/images/mickey-watch/watch-face.png" alt="Watch Face">
                </div>
                
                <!-- Hour Hand -->
                <div class="canvas-item" id="hourHandContainer">
                    <img src="/images/mickey-watch/hour-hand.png" alt="Hour Hand">
                </div>
                
                <!-- Minute Hand -->
                <div class="canvas-item" id="minuteHandContainer">
                    <img src="/images/mickey-watch/minute-hand.png" alt="Minute Hand">
                </div>
                
                <!-- Axis marker -->
                <div class="axis-marker" id="axisMarker"></div>
            </div>
        </div>

        <div class="section">
            <div class="instruction">
                <strong>Paste your config here:</strong> Copy the JSON configuration from the editor and paste it in the textarea below. The preview will update in real-time. When you're happy with it, copy this config and give it to me to integrate into the React component.
            </div>

            <div class="config-input-section">
                <h3>Paste Configuration JSON</h3>
                <textarea id="configInput" placeholder='Paste your config JSON here, like:
{
  "body": { "width": 600, "height": 600, "x": 0, "y": 0 },
  "watchFace": { "width": 280, "height": 280, "x": 0, "y": 0 },
  "hourHand": { "width": 200, "height": 200 },
  "minuteHand": { "width": 250, "height": 250 },
  "rotationAxis": { "x": 50, "y": 50 }
}'></textarea>
                <div class="button-group">
                    <button onclick="applyConfig()">Apply Config</button>
                    <button class="secondary" onclick="copyCurrentConfig()">Copy Current Config</button>
                </div>
                <div class="status-message" id="statusMessage"></div>
            </div>
        </div>
    </div>

    <script>
        const canvasWidth = 600;
        const canvasHeight = 600;

        // Get container elements
        const bodyContainer = document.getElementById('bodyContainer');
        const watchFaceContainer = document.getElementById('watchFaceContainer');
        const hourHandContainer = document.getElementById('hourHandContainer');
        const minuteHandContainer = document.getElementById('minuteHandContainer');
        const axisMarker = document.getElementById('axisMarker');
        const configInput = document.getElementById('configInput');
        const statusMessage = document.getElementById('statusMessage');

        // Default config
        const defaultConfig = {
            body: { width: 600, height: 600, x: 0, y: 0 },
            watchFace: { width: 280, height: 280, x: 0, y: 0 },
            hourHand: { width: 200, height: 200, x: 0, y: 0, rotation: 0 },
            minuteHand: { width: 250, height: 250, x: 0, y: 0, rotation: 0 },
            rotationAxis: { x: 50, y: 50 }
        };

        let currentConfig = { ...defaultConfig };

        function applyConfig() {
            try {
                const config = JSON.parse(configInput.value);
                
                // Validate config has required properties
                if (!config.body || !config.watchFace || !config.hourHand || !config.minuteHand || !config.rotationAxis) {
                    throw new Error('Invalid config structure. Missing required properties.');
                }

                currentConfig = config;
                updatePreview();
                
                showStatus('Config applied successfully!', 'success');
            } catch (error) {
                showStatus('Error: ' + error.message, 'error');
            }
        }

        function updatePreview() {
            const config = currentConfig;

            // Update body
            bodyContainer.style.width = config.body.width + 'px';
            bodyContainer.style.height = config.body.height + 'px';
            bodyContainer.style.left = (canvasWidth / 2 + config.body.x - config.body.width / 2) + 'px';
            bodyContainer.style.top = (canvasHeight / 2 + config.body.y - config.body.height / 2) + 'px';

            // Update watch face
            watchFaceContainer.style.width = config.watchFace.width + 'px';
            watchFaceContainer.style.height = config.watchFace.height + 'px';
            watchFaceContainer.style.left = (canvasWidth / 2 + config.watchFace.x - config.watchFace.width / 2) + 'px';
            watchFaceContainer.style.top = (canvasHeight / 2 + config.watchFace.y - config.watchFace.height / 2) + 'px';

            // Calculate axis position
            const axisX = canvasWidth * (config.rotationAxis.x / 100);
            const axisY = canvasHeight * (config.rotationAxis.y / 100);

            // Update hour hand
            hourHandContainer.style.width = config.hourHand.width + 'px';
            hourHandContainer.style.height = config.hourHand.height + 'px';
            hourHandContainer.style.left = (axisX - config.hourHand.width / 2 + config.hourHand.x) + 'px';
            hourHandContainer.style.top = (axisY - config.hourHand.height / 2 + config.hourHand.y) + 'px';
            hourHandContainer.style.transform = `rotate(${config.hourHand.rotation || 0}deg)`;
            hourHandContainer.style.transformOrigin = (config.hourHand.width / 2) + 'px ' + (config.hourHand.height / 2) + 'px';

            // Update minute hand
            minuteHandContainer.style.width = config.minuteHand.width + 'px';
            minuteHandContainer.style.height = config.minuteHand.height + 'px';
            minuteHandContainer.style.left = (axisX - config.minuteHand.width / 2 + config.minuteHand.x) + 'px';
            minuteHandContainer.style.top = (axisY - config.minuteHand.height / 2 + config.minuteHand.y) + 'px';
            minuteHandContainer.style.transform = `rotate(${config.minuteHand.rotation || 0}deg)`;
            minuteHandContainer.style.transformOrigin = (config.minuteHand.width / 2) + 'px ' + (config.minuteHand.height / 2) + 'px';

            // Update axis marker
            axisMarker.style.left = axisX + 'px';
            axisMarker.style.top = axisY + 'px';
        }

        function copyCurrentConfig() {
            const configText = JSON.stringify(currentConfig, null, 2);
            navigator.clipboard.writeText(configText).then(() => {
                showStatus('Configuration copied to clipboard!', 'success');
            });
        }

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = 'status-message ' + type;
            
            if (type === 'success') {
                setTimeout(() => {
                    statusMessage.textContent = '';
                    statusMessage.className = 'status-message';
                }, 3000);
            }
        }

        // Initialize with default config
        updatePreview();
    </script>
</body>
</html>
